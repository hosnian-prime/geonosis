[package]
name = "geonosis-federation-ldap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "LDAP / AD user federation provider."

[lints]
workspace = true

[features]
default = []
# Pulls the `ldap3` runtime in. Without this the crate compiles to its
# config-only surface, which is what unit-test consumers want.
ldap-runtime = ["dep:ldap3", "dep:tokio", "dep:parking_lot"]

[dependencies]
geonosis-core = { path = "../geonosis-core" }
geonosis-crypto = { path = "../geonosis-crypto" }

async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
url.workspace = true

# Optional runtime deps — only pulled when `ldap-runtime` is on.
ldap3 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
