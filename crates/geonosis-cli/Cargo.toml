[package]
name = "geonosis-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Operator CLI (geoctl) for Geonosis."

[lints]
workspace = true

[[bin]]
name = "geoctl"
path = "src/main.rs"

[dependencies]
geonosis-core = { path = "../geonosis-core" }
geonosis-flow = { path = "../geonosis-flow" }
geonosis-migrate = { path = "../geonosis-migrate" }
geonosis-storage = { path = "../geonosis-storage", features = ["postgres"] }
geonosis-federation-ldap = { path = "../geonosis-federation-ldap", features = ["ldap-runtime"] }

clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
tokio.workspace = true
sqlx.workspace = true
chrono.workspace = true
