[package]
name = "geonosis-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Identity broker (OIDC + SAML SP)."

[lints]
workspace = true

[features]
default = []
# The OIDC/SAML runtime (outbound HTTP + XML) is gated so the
# config-only surface still compiles in lightweight contexts.
broker-runtime = ["dep:reqwest", "dep:quick-xml", "dep:flate2", "dep:tokio"]

[dependencies]
geonosis-core = { path = "../geonosis-core" }
geonosis-saml-types = { path = "../geonosis-saml-types" }
geonosis-crypto = { path = "../geonosis-crypto" }

async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
url.workspace = true
base64.workspace = true
hex.workspace = true
sha2.workspace = true
rand.workspace = true
parking_lot.workspace = true
moka.workspace = true
percent-encoding.workspace = true
rsa.workspace = true
p256.workspace = true
ed25519-dalek.workspace = true
pkcs8.workspace = true
x509-parser.workspace = true

reqwest = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
