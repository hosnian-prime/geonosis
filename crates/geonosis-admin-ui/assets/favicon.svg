<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <radialGradient id="fb" cx="0.40" cy="0.35" r="0.68" fx="0.38" fy="0.32">
      <stop offset="0%"   stop-color="#8ca8c8"/>
      <stop offset="25%"  stop-color="#4a6e90"/>
      <stop offset="55%"  stop-color="#243a54"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </radialGradient>
    <radialGradient id="fn" cx="0.75" cy="0.70" r="0.50">
      <stop offset="0%"   stop-color="#040a14" stop-opacity="0"/>
      <stop offset="100%" stop-color="#020610" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="fh" cx="0.32" cy="0.26" r="0.22">
      <stop offset="0%"   stop-color="#e8e4f0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e8e4f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fa" cx="0.5" cy="0.5" r="0.5">
      <stop offset="82%"  stop-color="#6ca0d0" stop-opacity="0"/>
      <stop offset="94%"  stop-color="#6ca0d0" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#4a80b0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="fc"><circle cx="16" cy="16" r="9.5"/></clipPath>
    <filter id="fg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Planet -->
  <circle cx="16" cy="16" r="9.5" fill="url(#fb)"/>

  <!-- City grid (subtle) -->
  <g clip-path="url(#fc)" opacity="0.1">
    <line x1="7" y1="10" x2="25" y2="10" stroke="#90a8c0" stroke-width="0.2"/>
    <line x1="7" y1="13" x2="25" y2="13" stroke="#90a8c0" stroke-width="0.2"/>
    <line x1="7" y1="16" x2="25" y2="16" stroke="#90a8c0" stroke-width="0.2"/>
    <line x1="7" y1="19" x2="25" y2="19" stroke="#90a8c0" stroke-width="0.2"/>
    <line x1="7" y1="22" x2="25" y2="22" stroke="#90a8c0" stroke-width="0.2"/>
    <path d="M10,7 Q9,16 10,25" stroke="#90a8c0" stroke-width="0.2" fill="none"/>
    <path d="M14,7 Q13,16 14,25" stroke="#90a8c0" stroke-width="0.2" fill="none"/>
    <path d="M18,7 Q18,16 18,25" stroke="#90a8c0" stroke-width="0.2" fill="none"/>
    <path d="M22,7 Q23,16 22,25" stroke="#90a8c0" stroke-width="0.2" fill="none"/>
  </g>

  <!-- City lights (night side) -->
  <g clip-path="url(#fc)" filter="url(#fg)">
    <g opacity="0.8">
      <rect x="19" y="13" width="0.7" height="0.4" fill="#f0d890" rx="0.1"/>
      <rect x="20.5" y="14" width="0.5" height="0.3" fill="#ffe8a0" rx="0.1"/>
      <rect x="19" y="15" width="0.8" height="0.4" fill="#f0d890" rx="0.1"/>
      <rect x="21" y="15.5" width="0.6" height="0.3" fill="#e8c878" rx="0.1"/>
      <rect x="20" y="12" width="0.5" height="0.3" fill="#90c8f0" rx="0.1"/>
      <rect x="22" y="13" width="0.4" height="0.3" fill="#a0d0f0" rx="0.1"/>
    </g>
    <g opacity="0.65">
      <rect x="18" y="18" width="0.6" height="0.3" fill="#f0d890" rx="0.1"/>
      <rect x="20" y="17.5" width="0.7" height="0.4" fill="#ffe8a0" rx="0.1"/>
      <rect x="22" y="18" width="0.4" height="0.3" fill="#90c8f0" rx="0.1"/>
      <rect x="19" y="20" width="0.5" height="0.3" fill="#a0d0f0" rx="0.1"/>
      <rect x="21" y="19.5" width="0.6" height="0.3" fill="#f0d080" rx="0.1"/>
    </g>
    <g opacity="0.5">
      <circle cx="23" cy="16" r="0.2" fill="#f0d890"/>
      <circle cx="22" cy="20" r="0.15" fill="#90c8f0"/>
      <circle cx="17" cy="21" r="0.2" fill="#ffe8a0"/>
      <circle cx="20" cy="22" r="0.15" fill="#a0d0f0"/>
    </g>
  </g>

  <!-- Shadow + highlight -->
  <circle cx="16" cy="16" r="9.5" fill="url(#fn)"/>
  <circle cx="16" cy="16" r="9.5" fill="url(#fh)"/>
  <!-- Atmosphere -->
  <circle cx="16" cy="16" r="10.5" fill="url(#fa)"/>
</svg>
