[workspace]
resolver = "2"
members = [
    "crates/geonosis-core",
    "crates/geonosis-crypto",
    "crates/geonosis-cache",
    "crates/geonosis-storage",
    "crates/geonosis-migrate",
    "crates/geonosis-flow",
    "crates/geonosis-authenticators",
    "crates/geonosis-protocol-oauth",
    "crates/geonosis-protocol-oidc",
    "crates/geonosis-saml-types",
    "crates/geonosis-protocol-saml-idp",
    "crates/geonosis-federation-ldap",
    "crates/geonosis-broker",
    "crates/geonosis-spi-host",
    "crates/geonosis-spi-api",
    "crates/geonosis-audit",
    "crates/geonosis-server",
    "crates/geonosis-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/hosnian-prime/geonosis"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
result_large_err = "allow"
too_many_arguments = "allow"

[workspace.dependencies]
# Async / runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "io-util", "net"] }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["serde"] }

# IDs
ulid = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }

# HTTP
axum = { version = "0.7", features = ["macros", "tokio", "http2"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["trace", "compression-br", "cors", "limit"] }
http = "1"
url = { version = "2", features = ["serde"] }
hyper = "1"

# Crypto
sha2 = "0.10"
sha1 = "0.10"
blake3 = "1"
hmac = "0.12"
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
base64 = "0.22"
hex = "0.4"
constant_time_eq = "0.3"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
argon2 = "0.5"
aes-gcm = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
p256 = { version = "0.13", features = ["jwk", "ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
spki = "0.7"
pkcs8 = { version = "0.10", features = ["pem"] }
x509-parser = "0.16"

# Postgres
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "macros"] }

# Concurrency
parking_lot = "0.12"
arc-swap = "1"
moka = { version = "0.12", features = ["future"] }

# WASM
wasmtime = { version = "26", default-features = false, features = ["async", "cranelift", "component-model"] }
wasmtime-wasi = "26"
wit-bindgen = "0.36"

# LDAP
ldap3 = { version = "0.11", default-features = false, features = ["tls-rustls"] }

# Outbound HTTP — used by the SPI host's WASM `http-client` import
# and (on the broker branch) the OIDC RP runtime.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }

# Misc
once_cell = "1"
bytes = "1"
percent-encoding = "2"
indexmap = { version = "2", features = ["serde"] }
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
config = { version = "0.14", default-features = false, features = ["toml"] }

# Test only
tokio-test = "0.4"
pretty_assertions = "1"
proptest = "1"
