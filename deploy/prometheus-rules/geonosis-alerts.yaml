# Standalone Prometheus rule group for geonosis-server.
#
# Mirrors the rules wired into the chart's PrometheusRule resource
# (`deploy/helm/geonosis/templates/prometheusrule.yaml`) so operators
# running plain Prometheus (no kube-prometheus-stack) can drop these
# into `rule_files:` directly. Aim and thresholds come from
# `docs/13-observability.md` §"Dashboards (shipped)".

groups:
  - name: geonosis.rules
    rules:
      - alert: GeonosisErrorRateHigh
        expr: |
          sum(rate(geonosis_http_responses_total{class=~"5xx"}[5m]))
            /
          clamp_min(sum(rate(geonosis_http_requests_total[5m])), 1) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "geonosis 5xx error rate > 1% over 5m"
          description: "5xx ratio breached the 1% SLO for the past 5 minutes."

      - alert: GeonosisAuthorizeLatencyHigh
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(geonosis_http_request_duration_seconds_bucket{path=~".*authorize.*"}[10m]))
          ) > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p99 authorize latency > 250ms over 10m"

      - alert: GeonosisLoginFailureSpike
        expr: |
          sum(rate(geonosis_oidc_login_failures_total[5m]))
            /
          clamp_min(sum(rate(geonosis_oidc_authorize_total[5m])), 1) > 0.30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "login failure ratio > 30% over 5m"

      - alert: GeonosisDbPoolSaturated
        expr: (geonosis_db_pool_in_use / clamp_min(geonosis_db_pool_size, 1)) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres pool > 80% utilized"

      - alert: GeonosisSpiQuarantined
        expr: increase(geonosis_spi_quarantined_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "a SPI plugin was quarantined"

      - alert: GeonosisListenerLag
        expr: geonosis_listener_lag_seconds > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "cache-invalidation listener lag > 5s"

      - alert: GeonosisTokenReuse
        expr: increase(geonosis_token_reuse_detected_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "refresh-token reuse detected — possible token theft"
