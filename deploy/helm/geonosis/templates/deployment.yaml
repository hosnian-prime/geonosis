apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "geonosis.fullname" . }}
  labels:
    {{- include "geonosis.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "geonosis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "geonosis.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "geonosis.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: GEONOSIS_LISTEN
              value: {{ .Values.config.listen | quote }}
            - name: GEONOSIS_PUBLIC_URL
              value: {{ .Values.config.publicUrl | quote }}
            - name: GEONOSIS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.database.name | quote }}
                  key:  {{ .Values.secrets.database.key  | quote }}
            - name: GEONOSIS_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.masterKey.name | quote }}
                  key:  {{ .Values.secrets.masterKey.key  | quote }}
            {{- if .Values.config.otlpEndpoint }}
            - name: GEONOSIS_OTLP_ENDPOINT
              value: {{ .Values.config.otlpEndpoint | quote }}
            - name: OTEL_TRACES_SAMPLER
              value: {{ .Values.config.tracesSampler | quote }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .Values.config.tracesSamplerArg | quote }}
            {{- end }}
            {{- if .Values.secrets.otlp.name }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.otlp.name | quote }}
                  key:  {{ .Values.secrets.otlp.key  | quote }}
            {{- end }}
            - name: RUST_LOG
              value: {{ .Values.config.logLevel | quote }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          lifecycle:
            preStop:
              exec:
                command:
                  - "/bin/sh"
                  - "-c"
                  - "curl -fsS -X POST http://localhost:8080/-/drain && sleep {{ .Values.lifecycle.drainSleepSeconds }}"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # `readOnlyRootFilesystem: true` requires an emptyDir for tmp
        # so the audit-webhook retry queue + theme overlay watcher
        # have a writable scratch path.
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "geonosis.selectorLabels" . | nindent 14 }}
